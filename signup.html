```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .signup-container {
            width: 400px;

            padding: 40px;

            background: #ffffff;

            border-radius: 15px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .signup-container h1 {
            text-align: center;

            margin-bottom: 30px;

            color: #333;

            font-size: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #555;

            font-size: 14px;

            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;

            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .signup-container button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .signup-container button:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .signup-container button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #777;
        }

        .login-link a {
            color: #667eea;

            text-decoration: none;

            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <h1>Create Account</h1>

        <form action="/signup" method="POST">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit">
                Sign Up
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </div>

    </div>

</body>

</html>
```
